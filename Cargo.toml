[package]
name = "proof-wire"
#
# Renamed from `exchange-wire` and extracted to this public repository
# (Proof-labs/wire) on 2026-09-09 — see the README for consumers and the
# versioning discipline. The bytes have not changed.
# The wire contract shared by exchange-core (engine) and proof-trading-sdk
# (client SDK): MessagePack codec, Ed25519 signing preimage, action + wire
# types, and the ExecError code table. Extracted from exchange-core so both
# the private engine and the public SDK compile ONE definition — drift is
# impossible by construction. Kept dep-light and wasm/pyo3-clean: no
# bridge-core, no rand_core/getrandom. Versioned on the full MAJOR.MINOR.PATCH
# line (>=1.0.0); every wire-format change is >=MINOR.
#
# 1.0.0 -> 1.1.0: additive wire change (DEC-66). ConfirmDeposit/FailDeposit
# gain a trailing Option<DepositLocator> that encodes as nil when absent, so
# pre-locator bytes still decode -> MINOR.
#
# 1.1.0 -> 1.2.0: additive wire change (DEC-65). New AdminAction::UnpauseBridge
# inner tag 0x06 and Event::BridgeUnpauseAuthorized. Pre-existing bytes still
# decode unchanged -> MINOR.
#
# 1.2.0 -> 1.3.0: additive wire change (#422 / DEC-87). New
# AdminAction::UpdateAuthoritySet (inner tag 0x07), AuthorityDomain, and
# Event::AuthoritySetUpdated. Pre-existing bytes still decode unchanged
# -> MINOR.
#
# 1.3.0 -> 1.4.0: additive wire change (#467). New
# AdminAction::CancelAllOrdersForAccount (inner tag 0x08). Pre-existing bytes
#
# 1.4.0 -> 1.5.0: additive wire change (EN-01 standalone events). New
# AdminAction::CreateEvent at inner tag 0x09 (claiming the RT-01 reservation),
# plus the typed EventKey. Pre-existing bytes still decode unchanged -> MINOR.
# still decode unchanged -> MINOR.
version = "1.6.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
derive_more = { version = "1", features = ["from", "display"] }
serde_bytes = "0.11"
rmp-serde = "1"
proof-wire-derive = { path = "derive", version = "1" }
# No rand_core feature: the wire layer only verifies and deterministically
# signs (SigningKey::from_bytes + sign) — nothing generates keys, so nothing
# pulls getrandom, which would fail to build on wasm32-unknown-unknown.
ed25519-dalek = { version = "2" }
sha2 = "0.10"
sha3 = "0.10"

[dev-dependencies]
hex = "0.4"
serde_json = "1"

# Inherited from exchange-core: the wire layer holds these guarantees wherever
# it is compiled (consensus-critical bytes). Enforced under cargo clippy.
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
float_arithmetic = "deny"
arithmetic_side_effects = "deny"
disallowed_types = "deny"

[workspace]
members = ["derive"]
