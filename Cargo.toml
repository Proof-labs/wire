[package]
name = "proof-wire"
#
# The wire contract shared by exchange-core (engine) and proof-trading-sdk
# (client SDK): MessagePack codec, Ed25519 signing preimage, action + wire
# types, and the ExecError code table. Both the engine and the SDK compile ONE
# definition, so drift is impossible by construction. Kept dep-light and
# wasm/pyo3-clean: no rand_core/getrandom. Versioned on the full
# MAJOR.MINOR.PATCH line (>=1.0.0); every wire-format change is >=MINOR.
#
# 1.0.0 -> 1.1.0: additive wire change. ConfirmDeposit/FailDeposit gain a
# trailing Option<DepositLocator> that encodes as nil when absent, so
# pre-locator bytes still decode -> MINOR.
#
# 1.1.0 -> 1.2.0: additive wire change. New AdminAction::UnpauseBridge inner
# tag 0x06 and Event::BridgeUnpauseAuthorized. Pre-existing bytes still decode
# unchanged -> MINOR.
#
# 1.2.0 -> 1.3.0: additive wire change. New AdminAction::UpdateAuthoritySet
# (inner tag 0x07), AuthorityDomain, and Event::AuthoritySetUpdated.
# Pre-existing bytes still decode unchanged -> MINOR.
#
# 1.3.0 -> 1.4.0: additive wire change. New
# AdminAction::CancelAllOrdersForAccount (inner tag 0x08). Pre-existing bytes
# still decode unchanged -> MINOR.
#
# 1.4.0 -> 1.5.0: additive wire change (standalone events). New
# AdminAction::CreateEvent at inner tag 0x09, plus the typed EventKey.
# Pre-existing bytes still decode unchanged -> MINOR.
#
# 1.5.0 -> 1.6.0: additive wire change. New outer action ResolveEvent at 0x27
# resolves a standalone event; the impact-market resolution at 0x0F is renamed
# ResolveImpactMarket with an unchanged payload. Pre-existing bytes still decode
# unchanged -> MINOR.
#
# 1.6.0 -> 1.7.0: additive wire changes. New outer action
# SubmitOracleObservation at 0x2D, new inner admin ConfigureOraclePolicy at
# 0x0C, new inner admin SetOracleGuards at 0x0D, plus MarketOracleGuards,
# OracleRejectReason, FundingSkipReason types and ExecError::OracleGuardUnset
# (code 82). Pre-existing bytes still decode unchanged -> MINOR.
#
# 1.7.0 -> 1.8.0: additive admin-action tags. ScheduleUpgrade (0x0E) and
# CancelUpgrade (0x0F) add the on-chain upgrade-plan path; pre-existing bytes
# still decode unchanged -> MINOR.
#
# 1.8.0 -> 1.9.0: additive wire change (sub-accounts). New outer
# actions CreateSubAccount at 0x28 and SubAccountTransfer at 0x29, the frozen
# derive_sub_account, SubAccountCreated/SubAccountTransferCompleted events,
# and sub-account ExecError codes at 83-90 (moved off the oracle-guard range
# that claimed 82). Pre-existing bytes still decode unchanged -> MINOR.
#
# 1.9.0 -> 1.10.0: additive wire change. New outer action
# ClaimWithdrawalPayout at 0x2E — the single-holder Solana payout claim a
# custody-authorized watcher must hold before signing a payout — plus the
# WithdrawalPayoutLease state type, Event::WithdrawalPayoutLeaseAcquired and
# ExecError::WithdrawalPayoutLeaseActive (code 91). Pre-existing bytes still
# decode unchanged -> MINOR.
#
# 1.10.0 -> 2.0.0: BREAKING wire change. The impact-market family is removed:
# outer actions CreateImpactMarket
# (0x0E) and ResolveImpactMarket (0x0F), inner admin tag 3, ImpactMarketId /
# ImpactMarketInfo / ImpactMarketStatus, the family events and ExecError codes
# 24, 25 and 31 are retired, never reused. MarketKind::ConditionalPerp is
# re-rooted onto EventId, EventInfo gains its attached_conditionals list,
# AttachConditional claims inner admin tag 0x0A and
# the batch item set, event ExecError codes 92-96 are added, and CreateEvent
# and AttachConditional carry a per-book max_open_interest. Family bytes no
# longer decode -> MAJOR.
#
# 2.0.0 -> 2.1.0: additive wire change (trigger expansion). PlaceOrder (0x01),
# MarketOrder (0x04) and CancelReplaceOrder (0x1A) gain trailing optional
# stop_loss/take_profit limbs (`#[serde(default)]`, nil when absent) so
# pre-2.1.0 payloads still decode; Event gains PendingTriggersAttached and
# PendingTriggersDiscarded as appended variants,
# PositionTriggersInvalidated gains a defaulted invalidation_reason and
# PositionTriggersSet a defaulted source_order_id, and
# ExecError::TriggerOrderIncompatible is added at code 98. No new outer
# action bytes. Pre-existing bytes still decode unchanged -> MINOR.
version = "2.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
derive_more = { version = "1", features = ["from", "display"] }
serde_bytes = "0.11"
rmp-serde = "1"
proof-wire-derive = { path = "derive", version = "1" }
# No rand_core feature: the wire layer only verifies and deterministically
# signs (SigningKey::from_bytes + sign) — nothing generates keys, so nothing
# pulls getrandom, which would fail to build on wasm32-unknown-unknown.
ed25519-dalek = { version = "2" }
sha2 = "0.10"
sha3 = "0.10"

[dev-dependencies]
hex = "0.4"
serde_json = "1"

# Inherited from exchange-core: the wire layer holds these guarantees wherever
# it is compiled (consensus-critical bytes). Enforced under cargo clippy.
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
float_arithmetic = "deny"
arithmetic_side_effects = "deny"
disallowed_types = "deny"

[workspace]
members = ["derive"]
