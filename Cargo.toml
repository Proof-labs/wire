[package]
name = "proof-wire"
#
# The wire contract shared by exchange-core (engine) and proof-trading-sdk
# (client SDK): MessagePack codec, Ed25519 signing preimage, action + wire
# types, and the ExecError code table. Both the engine and the SDK compile ONE
# definition, so drift is impossible by construction. Kept dep-light and
# wasm/pyo3-clean: no rand_core/getrandom. Versioned on the full
# MAJOR.MINOR.PATCH line (>=1.0.0); every wire-format change is >=MINOR.
#
# 1.0.0 -> 1.1.0: additive wire change. ConfirmDeposit/FailDeposit gain a
# trailing Option<DepositLocator> that encodes as nil when absent, so
# pre-locator bytes still decode -> MINOR.
#
# 1.1.0 -> 1.2.0: additive wire change. New AdminAction::UnpauseBridge inner
# tag 0x06 and Event::BridgeUnpauseAuthorized. Pre-existing bytes still decode
# unchanged -> MINOR.
#
# 1.2.0 -> 1.3.0: additive wire change. New AdminAction::UpdateAuthoritySet
# (inner tag 0x07), AuthorityDomain, and Event::AuthoritySetUpdated.
# Pre-existing bytes still decode unchanged -> MINOR.
#
# 1.3.0 -> 1.4.0: additive wire change. New
# AdminAction::CancelAllOrdersForAccount (inner tag 0x08). Pre-existing bytes
# still decode unchanged -> MINOR.
#
# 1.4.0 -> 1.5.0: additive wire change (standalone events). New
# AdminAction::CreateEvent at inner tag 0x09, plus the typed EventKey.
# Pre-existing bytes still decode unchanged -> MINOR.
#
# 1.5.0 -> 1.6.0: additive wire change. New outer action ResolveEvent at 0x27
# resolves a standalone event; the impact-market resolution at 0x0F is renamed
# ResolveImpactMarket with an unchanged payload. Pre-existing bytes still decode
# unchanged -> MINOR.
#
# 1.6.0 -> 1.7.0: additive wire changes. New outer action
# SubmitOracleObservation at 0x2D, new inner admin ConfigureOraclePolicy at
# 0x0C, new inner admin SetOracleGuards at 0x0D, plus MarketOracleGuards,
# OracleRejectReason, FundingSkipReason types and ExecError::OracleGuardUnset
# (code 82). Pre-existing bytes still decode unchanged -> MINOR.
#
# 1.7.0 -> 1.8.0: additive admin-action tags. ScheduleUpgrade (0x0E) and
# CancelUpgrade (0x0F) add the on-chain upgrade-plan path; pre-existing bytes
# still decode unchanged -> MINOR.
#
# 1.8.0 -> 1.9.0: additive wire change (sub-accounts). New outer
# actions CreateSubAccount at 0x28 and SubAccountTransfer at 0x29, the frozen
# derive_sub_account, SubAccountCreated/SubAccountTransferCompleted events,
# and sub-account ExecError codes at 83-90 (moved off the oracle-guard range
# that claimed 82). Pre-existing bytes still decode unchanged -> MINOR.
#
# 1.9.0 -> 1.10.0: additive wire change. New outer action
# ClaimWithdrawalPayout at 0x2E — the single-holder Solana payout claim a
# custody-authorized watcher must hold before signing a payout — plus the
# WithdrawalPayoutLease state type, Event::WithdrawalPayoutLeaseAcquired and
# ExecError::WithdrawalPayoutLeaseActive (code 91). Pre-existing bytes still
# decode unchanged -> MINOR.
#
# 1.10.0 -> 2.0.0: BREAKING wire change. The impact-market family is removed:
# outer actions CreateImpactMarket
# (0x0E) and ResolveImpactMarket (0x0F), inner admin tag 3, ImpactMarketId /
# ImpactMarketInfo / ImpactMarketStatus, the family events and ExecError codes
# 24, 25 and 31 are retired, never reused. MarketKind::ConditionalPerp is
# re-rooted onto EventId, EventInfo gains its attached_conditionals list,
# AttachConditional claims inner admin tag 0x0A and
# the batch item set, event ExecError codes 92-96 are added, and CreateEvent
# and AttachConditional carry a per-book max_open_interest. Family bytes no
# longer decode -> MAJOR.
#
# 2.0.0 -> 2.1.0: additive wire change (trigger expansion). PlaceOrder (0x01),
# MarketOrder (0x04) and CancelReplaceOrder (0x1A) gain trailing optional
# stop_loss/take_profit limbs (`#[serde(default)]`, nil when absent) so
# pre-2.1.0 payloads still decode; Event gains PendingTriggersAttached and
# PendingTriggersDiscarded as appended variants,
# PositionTriggersInvalidated gains a defaulted invalidation_reason and
# PositionTriggersSet a defaulted source_order_id, and
# ExecError::TriggerOrderIncompatible is added at code 98. No new outer
# action bytes. Pre-existing bytes still decode unchanged -> MINOR.
#
# 2.1.0 -> 2.2.0: additive wire change (conversion of winning conditionals).
# ConditionalSettled gains a defaulted converted_size and fallback_reason
# (`#[serde(default)]`, 0 and nil when absent), and ConversionFallbackReason
# is added. No new action bytes, events or error codes. Pre-existing bytes
# still decode unchanged -> MINOR.
#
# 2.2.0 -> 2.3.0: additive wire change. New AdminAction::SetPlpConfig (inner
# tag 0x10) carrying the SetPlpConfig payload, and Event::PlpConfigUpdated.
# No new outer action bytes. Pre-existing bytes still decode unchanged
# -> MINOR.
#
# 2.3.0 -> 2.4.0: additive wire change. ExecError::OracleVerdictUnavailable
# takes code 77, the first of the 77-81 block reserved for oracle-policy
# errors, and carries the new OracleReason (the oracle-policy classifier's
# verdict reason). No action bytes or events change -> MINOR.
#
# 2.4.0 -> 3.0.0: action 0x11 (RunLiquidationSweep) retired; liquidation is
# the daemon's LiquidateAccounts only. Bytes that decoded before no longer
# do -> MAJOR.
#
# 3.0.0 -> 4.0.0: the HLP identifiers become PLP (Proof liquidity provider):
# AdminAction::SetHlpConfig -> SetPlpConfig (inner tag 0x10 unchanged),
# Event::HlpAbsorbed -> PlpAbsorbed, and Event::HlpConfigUpdated ->
# PlpConfigUpdated. The derive turns variant names into the ABCI event type
# strings, so hlp_absorbed and hlp_config_updated become plp_absorbed and
# plp_config_updated on the event surface, and Rust dependents naming the
# old variants no longer compile. Action and event tags are unchanged
# -> MAJOR.
#
# 4.0.0 -> 5.0.0: BREAKING wire change. ScheduleUpgrade's protocol_version is
# replaced by the successor's engine release (major, minor). ScheduleUpgrade
# bytes of the old shape no longer decode -> MAJOR. Additive in the same
# jump: ExecError::WithdrawalLimitExceeded takes code 99 and
# ExecError::AccountOrderCapReached takes code 100.
#
# 5.0.0 -> 6.0.0: BREAKING wire change. An event has one binary book:
# EventInfo, EventCreated and CreateEvent lose the No book, so event records
# and events of the old shape no longer decode -> MAJOR. Additive in the same
# jump, for the upgrade that retires the No book: CancelReason::Upgrade, and
# Event::OrderMigrated and Event::PositionMigrated as appended variants, and
# abci_event::EventPhase, the `phase` attribute that labels block-level events
# (rendered by proof-wire-derive 1.2).
#
# 6.0.0 -> 6.1.0: additive wire change (SA-1). New
# AdminAction::EnableSubAccounts (inner tag 0x15) and
# Event::SubAccountsEnabled authorize the sub-account actions at quorum
# instead of through a compiled activation height. No new outer action bytes and
# no new ExecError codes. Pre-existing bytes still decode unchanged -> MINOR.
#
# 6.1.0 -> 6.2.0: additive wire change (triggers as ordinary orders). New
# proposer-injected outer action ExecuteTriggers at 0x2F carrying a sorted,
# deduplicated Vec<TriggerRef> (owner, market), capped at
# MAX_EXECUTE_TRIGGERS; rejected from the mempool on every ingress route like
# LiquidateAccounts (0x1D). TriggerOutcomeReason gains the order-path outcomes
# market_closed and engine_fault, and Event::PositionTriggerDeferred is now
# emitted once per attempt while a limb stays blocked rather than once per
# market transition. No existing action bytes, event tags or ExecError codes
# change; pre-existing bytes still decode unchanged -> MINOR.
# 6.2.0 -> 6.3.0: additive wire change (order reporting). TradeExecuted gains
# trailing defaulted mark_price/oracle_price, MarketOrderProcessed gains
# trailing defaulted time_in_force/limit_price and is now also emitted for IOC
# and FOK limit orders, and Event::OrderRejected is appended. Pre-existing
# bytes still decode unchanged -> MINOR.
#
# 6.3.0 -> 6.4.0: additive wire change (short-fill reasons, the global
# liquidation configuration and the partial-liquidation fee).
# MarketOrderProcessed reports the submitted quantity again and gains a
# trailing defaulted unfilled_reason (ReduceOnlyCap, SelfTrade or
# NoLiquidity, nil when it all filled) with the UnfilledReason enum; inner
# admin tag 0x11 leaves its RT-01 reservation as
# AdminAction::SetLiquidationConfig, carrying the global liquidation
# configuration (target ratio, exact full-close threshold, partial penalty,
# work limits) behind a compare-and-set sequence, and
# Event::LiquidationConfigSet is appended, then Event::PartialLiquidationFee
# (the per-fill partial-liquidation penalty receipt), then
# Event::LiquidationConfigSet is appended, then Event::PartialLiquidationFee
# (the per-fill partial-liquidation penalty receipt), then
# Event::FullLiquidationFee (the full-liquidation penalty receipt, one per
# completed full close), then Event::LiquidationProgressReported (one
# outcome per owner a liquidation batch names) with its LiquidationProgress
# enum. No existing action bytes, existing event tags or ExecError codes
# change; pre-existing bytes still decode unchanged -> MINOR.
#
# Unreleased: breaking wire change (deterministic book liquidation).
# LiquidationConfig, SetLiquidationConfig and Event::LiquidationConfigSet
# drop max_candidate_prefixes, max_state_reads and max_state_read_bytes, so
# their 6.4.0 bytes no longer decode; Event::FullLiquidationFee is removed
# -> MAJOR. Event::PositionLiquidated (one per position an owner's
# liquidation reduced) and Event::LiquidationFailed (with its
# LiquidationRefusal enum) are appended, and ExecError::LiquidationRefused
# takes code 111.
version = "6.4.0"
edition = "2021"

[features]
default = ["full"]
# The action types, codec and signing.
full = [
    "rust-crypto",
    "dep:serde",
    "dep:derive_more",
    "dep:serde_bytes",
    "dep:rmp-serde",
    "dep:proof-wire-derive",
    "dep:ed25519-dalek",
]
# The bridge payloads clients sign. bridge-core and its Solana program take
# `default-features = false, features = ["bridge"]` to compile it alone.
bridge = ["dep:borsh"]
# Software SHA-256/Keccak, including `bridge::hash::RustCrypto`.
rust-crypto = ["dep:sha2", "dep:sha3"]

[dependencies]
borsh = { version = "1.5", features = ["derive"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
derive_more = { version = "1", features = ["from", "display"], optional = true }
serde_bytes = { version = "0.11", optional = true }
rmp-serde = { version = "1", optional = true }
proof-wire-derive = { path = "derive", version = "1.2", optional = true }
# No rand_core feature: the wire layer only verifies and deterministically
# signs (SigningKey::from_bytes + sign) — nothing generates keys, so nothing
# pulls getrandom, which would fail to build on wasm32-unknown-unknown.
ed25519-dalek = { version = "=2.2.0", optional = true }
sha2 = { version = "=0.10.9", optional = true }
sha3 = { version = "=0.10.8", optional = true }

[[example]]
name = "decode_tx"
required-features = ["full"]

[[test]]
name = "conditional_settled_conversion"
required-features = ["full"]

[[test]]
name = "order_reporting_events"
required-features = ["full"]

[[test]]
name = "liquidation_config"
required-features = ["full"]

[[test]]
name = "partial_liquidation_fee"
required-features = ["full"]

[[test]]
name = "liquidation_progress"
required-features = ["full"]

[[test]]
name = "liquidation_report"
required-features = ["full"]

[dev-dependencies]
hex = "0.4"
serde_json = "1"

# Inherited from exchange-core: the wire layer holds these guarantees wherever
# it is compiled (consensus-critical bytes). Enforced under cargo clippy.
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
float_arithmetic = "deny"
arithmetic_side_effects = "deny"
disallowed_types = "deny"

[workspace]
members = ["derive"]
