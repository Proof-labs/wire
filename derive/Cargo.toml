[package]
name = "proof-wire-derive"
version = "1.1.0"
edition = "2021"
# Mirrored from Proof-labs/exchange `exchange-derive` (the AbciEvent
# derive), vendored here so proof-wire is self-contained. Keep in sync:
# the snake_case event names it renders are pinned by proof-wire's own
# conformance tests and by the engine's golden vectors.
[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
