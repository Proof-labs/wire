[package]
name = "proof-wire-derive"
version = "1.1.0"
edition = "2021"
# The AbciEvent derive macro, kept self-contained here so proof-wire has no
# engine dependency. The snake_case event names it renders are pinned by
# proof-wire's own conformance tests and by the engine's golden vectors.
[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
